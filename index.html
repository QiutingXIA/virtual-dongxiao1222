<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;700&display=swap');

            font-family: "Noto Serif SC", serif;
            display: flex; height: 100vh; width: 100vw; overflow: hidden;
            background-color: #050505; color: #e0e0e0; margin: 0; padding: 0;
            transition: background-color 1.5s ease;
        }

        /* UI Overlay */
        .right-section {
            flex: 1; position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden; z-index: 1;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            transition: background 1.5s ease;
        }
        
        /* Paper Mode Background Overrides */
        body.paper-mode { background-color: #f4f1e7; color: #333; }
        body.paper-mode .right-section {
            background: radial-gradient(circle at center, #fcfbf8 0%, #e6e2d3 100%);
        }
        body.paper-mode #title-decoration { color: rgba(0,0,0,0.2); text-shadow: none; }
        body.paper-mode #ui-hint { color: rgba(0,0,0,0.4); text-shadow: none; }
        body.paper-mode .flute-img { filter: brightness(1.1) contrast(1.1) grayscale(0.1) opacity(0.8); }

        /* Landscape Mode Overrides */
        body.landscape-mode #fluteWrapper { opacity: 0; pointer-events: none; }
        body.landscape-mode #title-decoration { opacity: 0; }
        
        /* === NEW: Red Sun === */
        .red-sun {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 80px;
            height: 80px;
            background-color: #bc3e3e;
            border-radius: 50%;
            filter: blur(4px);
            opacity: 0;
            transition: opacity 2s ease 0.5s; /* Delay appearance */
            pointer-events: none;
            z-index: 0;
            mix-blend-mode: multiply; /* Ink blend effect */
        }
        body.landscape-mode .red-sun {
            opacity: 0.85;
        }

        /* === NEW: Birds Animation === */
        .bird-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: hidden;
            opacity: 0;
            transition: opacity 1s;
        }
        body.landscape-mode .bird-container {
            opacity: 1;
        }
        .bird {
            position: absolute;
            width: 8px; height: 4px;
            border-bottom: 2px solid rgba(20, 20, 20, 0.7);
            border-left: 2px solid rgba(20, 20, 20, 0.7);
            transform: rotate(45deg);
        }
        .bird:nth-child(1) { top: 20%; animation: fly 18s linear infinite; animation-delay: 0s; }
        .bird:nth-child(2) { top: 25%; animation: fly 22s linear infinite; animation-delay: 5s; transform: scale(0.8) rotate(45deg); }
        .bird:nth-child(3) { top: 18%; animation: fly 15s linear infinite; animation-delay: 10s; transform: scale(0.6) rotate(45deg); }

        @keyframes fly {
            0% { left: 110%; transform: translateY(0) rotate(45deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: -10%; transform: translateY(-50px) rotate(45deg); opacity: 0; }
        }

        #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; cursor: pointer; }

        /* Typography */
        #title-decoration {
            position: absolute; top: 12%; right: 12%;
            writing-mode: vertical-rl; text-orientation: upright;
            font-family: 'Ma Shan Zheng', cursive; font-size: 2.2rem; letter-spacing: 1rem;
            color: rgba(255, 255, 255, 0.15); pointer-events: none; z-index: 2;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
            transition: all 1.5s;
        }
        
        #ui-hint {
            position: absolute; bottom: 40px; width: 100%; text-align: center;
            color: rgba(255, 255, 255, 0.3); font-size: 0.9rem; pointer-events: none; z-index: 2;
            letter-spacing: 2px; text-shadow: 0 0 5px rgba(0,0,0,0.5);
            transition: all 1.5s;
        }

        /* Mode Toggle Button (Seal Style) */
        #btnPaperMode {
            position: absolute;
            bottom: 20%;
            right: 8%;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            z-index: 20;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(2px);
            background: rgba(0,0,0,0.2);
            letter-spacing: 5px;
        }
        #btnPaperMode:hover {
            transform: scale(1.1);
            border-color: #d4af37;
            color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        
        #btnPaperMode.state-paper {
            background-color: #8b0000;
            border-color: #8b0000;
            color: white;
            box-shadow: 0 4px 10px rgba(139, 0, 0, 0.4);
            border-radius: 2px; 
        }
        
        #btnPaperMode.state-scroll {
            background-color: #2c3e50;
            border-color: #34495e;
            color: #bdc3c7;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Sidebar */
        .left-section {
            background-color: rgba(18, 18, 18, 0.9); 
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 20; position: relative; backdrop-filter: blur(20px);
            color: #cccccc; min-width: 320px; max-width: 320px;
            box-shadow: 10px 0 40px rgba(0,0,0,0.8);
            display: flex; flex-direction: column;
        }
        .bg-card { background-color: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.05); }
        
        .btn-base { background-color: #1a1a1a; color: #aaa; border: 1px solid #333; transition: all 0.2s; }
        .btn-base:hover { background-color: #2a2a2a; color: #fff; border-color: #555; }
        
        .flute-wrapper {
            position: relative; width: 60vh; max-width: none; z-index: 10;
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: rotate(-90deg); margin-right: -5%; 
            animation: float 8s ease-in-out infinite;
            filter: drop-shadow(0px 0px 30px rgba(255, 255, 255, 0.05));
        }
        .flute-wrapper.observing { opacity: 0; transform: rotate(-90deg) translateX(100px); pointer-events: none; }
        @keyframes float {
            0% { transform: rotate(-90deg) translateX(0px) translateY(0px); }
            50% { transform: rotate(-90deg) translateX(-10px) translateY(5px); }
            100% { transform: rotate(-90deg) translateX(0px) translateY(0px); }
        }
        .flute-img { width: 100%; height: auto; display: block; filter: brightness(0.6) contrast(1.4) grayscale(0.3); transition: filter 1.5s; }

        .hole {
            width: 3.8%; padding-bottom: 3.8%; border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2); position: absolute;
            transform: translate(-50%, -50%); transition: all 0.15s;
            box-shadow: 0 0 5px rgba(255,255,255,0.1);
        }
        .hole.closed { background-color: #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); border-color: #fff; }
        .hole.open { background-color: rgba(0, 0, 0, 0.8); }

        .btn-trigger {
            font-size: 0.75rem; padding: 8px 0; border-radius: 4px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc;
            transition: all 0.2s;
        }
        .btn-trigger:hover { background: rgba(255,255,255,0.15); border-color: #fff; color: #fff; }
        .meter-bar { height: 6px; width: 0%; background: linear-gradient(90deg, #d4af37, #ff5722); transition: width 0.05s linear; border-radius: 3px; }

        /* Hole Positions */
        #hole-L4 { left: 15.9%; top: 51.6%; width: 1.9%; padding-bottom: 1.9%; }
        #hole-L3 { left: 30.4%; top: 51.6%; width: 2.3%; padding-bottom: 2.3%; }
        #hole-L2 { left: 35.1%; top: 51.6%; width: 2.2%; padding-bottom: 2.2%; }
        #hole-L1 { left: 39.1%; top: 51.7%; width: 2.2%; padding-bottom: 2.2%; }
        #hole-R4 { left: 45.8%; top: 51.9%; width: 2.5%; padding-bottom: 2.5%; }
        #hole-R3 { left: 48.5%; top: 51.8%; width: 1.9%; padding-bottom: 1.9%; }
        #hole-R2 { left: 52.8%; top: 51.7%; width: 1.9%; padding-bottom: 1.9%; }
        #hole-R1 { left: 60.1%; top: 51.9%; width: 1.9%; padding-bottom: 1.9%; }
    </style>
</head>
<body>
    
    <!-- Water/Ink Flow Shader -->
    <script type="x-shader/x-vertex" id="waterVertex">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    </script>
    <script type="x-shader/x-fragment" id="waterFragment">
        uniform float uTime;
        uniform vec3 uColor;
        uniform float uOpacity;
        varying vec2 vUv;

        // Simple Noise
        float random (in vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233)))*43758.5453123);
        }
        float noise (in vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        void main() {
            // Horizontal flow
            float flow = noise(vec2(vUv.x * 6.0 + uTime * 0.2, vUv.y * 3.0));
            
            // Create "ink streams"
            float stream = smoothstep(0.4, 0.6, flow);
            
            // Fade edges
            float edgeFade = 1.0 - pow(abs(vUv.y - 0.5) * 2.0, 2.0);
            
            vec3 color = uColor;
            float alpha = stream * edgeFade * uOpacity;
            
            gl_FragColor = vec4(color, alpha);
        }
    </script>

    <!-- LEFT PANEL -->
    <div class="left-section p-6 overflow-y-auto h-full text-sm">
        <h1 class="text-3xl font-bold mb-1 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 font-serif">气韵 · 六合</h1>
        <p class="text-gray-500 italic mb-6">Virtual Dongxiao Space</p>

        <!-- Mode Switch -->
        <button id="btnModeSwitch" class="w-full py-4 mb-6 rounded bg-gray-800 border border-gray-700 hover:border-gray-500 text-gray-300 font-serif text-lg transition shadow-lg flex items-center justify-center gap-2">
            <span>⏹</span> <span id="btnModeText">Observe Mode</span>

        <!-- Arduino Controls -->
        <div class="flex flex-col gap-3 mb-6">

        <!-- Audio Section -->
        <div class="mt-auto">

                Start Experience
            </button>
            
            <div id="audioControls" class="opacity-50 pointer-events-none transition-opacity space-y-3">

                <label class="block text-gray-500 mt-4 text-xs">Mic Threshold</label>
                <input type="range" id="micThreshold" min="0" max="50" value="10" class="w-full h-1 bg-gray-700 rounded appearance-none cursor-pointer">
                
                <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="autoBlow" class="rounded bg-gray-800 border-gray-600">

    <!-- RIGHT VISUALIZATION -->
    <div class="right-section">
        <!-- New Elements -->
        <div class="red-sun"></div>
        <div class="bird-container">
            <div class="bird"></div>
            <div class="bird"></div>
            <div class="bird"></div>
        </div>

        <div id="title-decoration">道 法 自 然</div>
        
        <div id="webgl-container"></div>
        
        <!-- Multi-State Toggle Button -->
        <button id="btnPaperMode" title="Switch Mode">
            宣纸
        </button>

        <div id="ui-hint">Sound Moves Form · Void & Reality</div>

        <!-- Flute Overlay -->
        <div class="flute-wrapper" id="fluteWrapper">
            <img src="electronic_dongxiao.png" alt="Dongxiao" class="flute-img" onerror="this.style.display='none'">
            <div id="hole-L4" class="hole open"></div>
            <div id="hole-L3" class="hole open"></div>
            <div id="hole-L2" class="hole open"></div>
            <div id="hole-L1" class="hole open"></div>
            <div id="hole-R4" class="hole open"></div>
            <div id="hole-R3" class="hole open"></div>
            <div id="hole-R2" class="hole open"></div>
            <div id="hole-R1" class="hole open"></div>
        </div>
    </div>

    <script>
        // ================= JS Logic =================
        let holes = { L: [0, 0, 0, 0], R: [0, 0, 0, 0] };
        let currentNoteIndex = 0; 
        let isAudioReady = false;
        let globalGain = 0; 
        let manualGain = 0; 
        let isObserving = false; 
        let isHovering = false;
        
        let visualMode = 0; 

        const NOTE_MAP = [
            null, 
            { name: "Si (Earth)", file: "si.wav" },
            { name: "La (Water)", file: "la.wav" },
            { name: "So (Wood)", file: "so.wav" },
            { name: "Mi (Metal)", file: "mi.wav" },
            { name: "Re (Void)", file: "re.wav" },
            { name: "Do (Fire)", file: "do.wav" }
        ];

        const audioPool = {};
        
        // --- Interaction Logic ---
        function triggerPreset(idx) {
            if (isObserving) return;
            document.querySelectorAll('.hole').forEach(h => h.className = 'hole open');
            currentNoteIndex = idx;
            manualGain = 1.0;
            if(idx === 1) document.getElementById('hole-L4').className = 'hole closed';
        }

     const audioPool = {}; 
        async function loadAllAudio() {
            console.log("开始加载音频...");
            NOTE_MAP.forEach(note => {
                if (note && note.file) {
                    const audio = new Audio(note.file);
                    audio.preload = "auto";
                    // 如果加载失败，在控制台报错提示
                    audio.onerror = () => console.error("无法加载文件: " + note.file);
                    audioPool[note.file] = audio;
                }
            });
            isAudioReady = true;
            document.getElementById('audioControls').classList.remove('opacity-50', 'pointer-events-none');
        }

// 关键：手动绑定按钮，强制浏览器开启音频通路
        document.getElementById('btnStartAudio').onclick = async function() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            console.log("音频上下文已激活");
            initAudio(); // 运行你原本的麦克风逻辑
            this.style.display = 'none'; // 隐藏按钮防止重复点击
        };
        
        async function initAudio() {
            if (isAudioStarted) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const source = audioCtx.createMediaStreamSource(stream);
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256;
                    source.connect(analyser);
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                } catch(e) { console.log("Mic failed, using manual mode only"); }

                isAudioStarted = true;
                document.getElementById('btnStartAudio').classList.add('hidden');
                document.getElementById('audioControls').classList.remove('opacity-50', 'pointer-events-none');
                updateAudioLoop();
            } catch (err) { alert("Audio init failed: " + err); }
        }

        function getVolume() {
            if (!analyser) return 0;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            return sum / dataArray.length;
        }

        function updateAudioLoop() {
            requestAnimationFrame(updateAudioLoop);
            let vol = 0;
            if (analyser) vol = getVolume();
            const threshold = parseInt(document.getElementById('micThreshold').value);
            const autoBlow = document.getElementById('autoBlow').checked;
            let gain = 0;

            if (autoBlow) {
                gain = 0.5 + Math.sin(Date.now()*0.002)*0.45; 
                if(gain < 0) gain = 0;
            } else if (vol > threshold) {
                gain = Math.min((vol - threshold) / (100 - threshold), 1.0);
            } else if (manualGain > 0) {
                gain = manualGain;
                manualGain *= 0.96; 
                if (manualGain < 0.01) manualGain = 0;
            }
            globalGain = gain;
            
            document.getElementById('breathMeter').style.width = `${gain * 100}%`;
            document.getElementById('breathVal').innerText = `${Math.floor(gain * 100)}%`;
        }
        
        window.addEventListener('keydown', (e) => {
            if(e.key >= '1' && e.key <= '6') triggerPreset(parseInt(e.key));
        });

        // ================= SERIAL CONNECTION (ARDUINO) =================
        async function connectSerial(hand) {
            if (!navigator.serial) return alert("Please use Chrome or Edge browser for serial port support.");
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                document.getElementById(`status${hand}`).innerText = "Connected";
                document.getElementById(`status${hand}`).classList.replace("text-gray-600", "text-green-500");
                const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
                let buffer = "";
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += value;
                    const lines = buffer.split('\r\n');
                    buffer = lines.pop();
                    for (const line of lines) handleData(hand, line);
                }
            } catch (e) { console.log("Serial cancelled or failed:", e); }
        }

        function handleData(hand, line) {
            const parts = line.trim().split(',').map(Number);
            if (parts.length !== 4) return;
            const target = (hand === 'L') ? holes.L : holes.R;
            for(let i=0; i<4; i++) target[i] = parts[i];
            
            const prefix = (hand === 'L') ? 'L' : 'R'; 
            document.getElementById(`hole-${prefix}4`).className = parts[0] ? 'hole closed' : 'hole open';
            document.getElementById(`hole-${prefix}3`).className = parts[1] ? 'hole closed' : 'hole open';
            document.getElementById(`hole-${prefix}2`).className = parts[2] ? 'hole closed' : 'hole open';
            document.getElementById(`hole-${prefix}1`).className = parts[3] ? 'hole closed' : 'hole open';
        }

        document.getElementById('btnConnectL').onclick = () => connectSerial('L');
        document.getElementById('btnConnectR').onclick = () => connectSerial('R');


        // ================= THREE.JS =================
        let scene, camera, renderer;
        let roomGroup, connectionGroup, waterGroup;
        let wallMeshes = [];
        let simplex = new SimplexNoise();
        let time = 0;
        let particles;
        let waterMesh, waterUniforms;

        const WALL_SIZE = 140;
        const SEGMENTS = 64; 
        
        // Colors
        const COLORS = {
            WOOD:  new THREE.Color(0x00ff9d), 
            FIRE:  new THREE.Color(0xff3d00), 
            EARTH: new THREE.Color(0xffd700),
            METAL: new THREE.Color(0xe0e0e0), 
            WATER: new THREE.Color(0x2979ff), 
            VOID:  new THREE.Color(0x9c27b0)
        };
        
        const INK_COLOR = new THREE.Color(0x111111); 
        const PAPER_BG = new THREE.Color(0xf4f1e7);  
        const DARK_BG = new THREE.Color(0x050505);   

        const EXP_SCALE = 1.6; 
        const CAMERA_NEAR = 65;  
        const CAMERA_FAR = 180;  
        const CAMERA_SCROLL = 500; 

        // Flat Position for Landscape Mode
        const WALL_CONFIG = [
            { id: 'floor', name: 'Earth', color: COLORS.EARTH, noteIdx: [1], origPos: [0, -WALL_SIZE/2, 0], origRot: [-Math.PI/2, 0, 0], explodedPos: [0, -WALL_SIZE/2 * EXP_SCALE, 0], flatPos: [-0.5 * WALL_SIZE, 0, 0] }, 
            { id: 'ceiling', name: 'Void', color: COLORS.VOID, noteIdx: [5], origPos: [0, WALL_SIZE/2, 0], origRot: [Math.PI/2, 0, 0], explodedPos: [0, WALL_SIZE/2 * EXP_SCALE, 0], flatPos: [2.5 * WALL_SIZE, 0, 0] },    
            { id: 'back', name: 'Water', color: COLORS.WATER, noteIdx: [2], origPos: [0, 0, -WALL_SIZE/2], origRot: [0, 0, 0], explodedPos: [0, 0, -WALL_SIZE/2 * EXP_SCALE, 0], flatPos: [0.5 * WALL_SIZE, 0, 0] },    
            { id: 'left', name: 'Wood', color: COLORS.WOOD, noteIdx: [3], origPos: [-WALL_SIZE/2, 0, 0], origRot: [0, Math.PI/2, 0], explodedPos: [-WALL_SIZE/2 * EXP_SCALE, 0, 0], flatPos: [-2.5 * WALL_SIZE, 0, 0] }, 
            { id: 'right', name: 'Metal', color: COLORS.METAL, noteIdx: [4], origPos: [WALL_SIZE/2, 0, 0], origRot: [0, -Math.PI/2, 0], explodedPos: [WALL_SIZE/2 * EXP_SCALE, 0, 0], flatPos: [1.5 * WALL_SIZE, 0, 0] }, 
            { id: 'front', name: 'Fire', color: COLORS.FIRE, noteIdx: [6], origPos: [0, 0, WALL_SIZE/2], origRot: [0, Math.PI, 0], explodedPos: [0, 0, WALL_SIZE/2 * EXP_SCALE, 0], flatPos: [-1.5 * WALL_SIZE, 0, 0] }     
        ];

        function initThree() {
            const container = document.getElementById('webgl-container');
            container.addEventListener('mouseenter', () => isHovering = true);
            container.addEventListener('mouseleave', () => isHovering = false);

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.005); 

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 0, CAMERA_NEAR); 
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            roomGroup = new THREE.Group();
            connectionGroup = new THREE.Group();
            scene.add(roomGroup);
            scene.add(connectionGroup);

            // Walls
            const geometry = new THREE.PlaneGeometry(WALL_SIZE, WALL_SIZE, SEGMENTS, SEGMENTS);
            WALL_CONFIG.forEach((config) => {
                const material = new THREE.MeshBasicMaterial({
                    color: config.color,
                    wireframe: true,
                    transparent: true,
                    opacity: 0.15, 
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(geometry.clone(), material);
                mesh.position.set(...config.origPos);
                mesh.rotation.set(...config.origRot);
                
                const count = mesh.geometry.attributes.position.count;
                mesh.userData = {
                    accumulatedZ: new Float32Array(count).fill(0), 
                    config: config,
                    baseColor: config.color, 
                    defaultColor: new THREE.Color(0x333333) 
                };

                roomGroup.add(mesh);
                wallMeshes.push(mesh);
            });
            
            // --- NEW: Flowing Ink Water Plane ---
            const waterGeo = new THREE.PlaneGeometry(WALL_SIZE * 6, 80, 100, 20); // Long strip
            waterUniforms = {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0x222222) },
                uOpacity: { value: 0.0 }
            };
            const waterMat = new THREE.ShaderMaterial({
                uniforms: waterUniforms,
                vertexShader: document.getElementById('waterVertex').textContent,
                fragmentShader: document.getElementById('waterFragment').textContent,
                transparent: true,
                depthWrite: false,
                blending: THREE.NormalBlending // Normal blend for ink
            });
            waterMesh = new THREE.Mesh(waterGeo, waterMat);
            waterMesh.position.set(0, -30, 0); // Below the mountains
            waterMesh.rotation.x = -Math.PI/2; // Flat on ground (visual) - actually below camera view in profile
            // In profile view, mountains are X rotated -90. Water needs to be parallel or slightly tilted.
            // Let's adjust in animation loop based on view.
            roomGroup.add(waterMesh);


            addParticles();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function addParticles() {
            const count = 3000;
            const geometry = new THREE.BufferGeometry();
            const vertices = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const speeds = new Float32Array(count); 
            
            const colorPalette = Object.values(COLORS);

            for (let i = 0; i < count; i++) { 
                vertices[i*3] = (Math.random() - 0.5) * WALL_SIZE * 2.0;
                vertices[i*3+1] = (Math.random() - 0.5) * WALL_SIZE * 2.0;
                vertices[i*3+2] = (Math.random() - 0.5) * WALL_SIZE * 2.0;
                
                const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors[i*3] = c.r;
                colors[i*3+1] = c.g;
                colors[i*3+2] = c.b;
                speeds[i] = 0.05 + Math.random() * 0.1;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('speed', new THREE.BufferAttribute(speeds, 1));
            geometry.setAttribute('origColor', new THREE.BufferAttribute(colors.slice(), 3));

            const material = new THREE.PointsMaterial({ 
                vertexColors: true, size: 0.8, opacity: 0.6, transparent: true,
                blending: THREE.AdditiveBlending, sizeAttenuation: true
            });
            particles = new THREE.Points(geometry, material);
            roomGroup.add(particles);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleMode() {
            visualMode = (visualMode + 1) % 3;
            const btn = document.getElementById('btnPaperMode');
            const hint = document.getElementById('ui-hint');

            // Apply Visual Changes based on Mode
            if (visualMode === 0) {
                // To Wireframe (Default)
                btn.innerText = "宣纸";
                btn.className = "";
                hint.innerText = "Sound Moves Form · Void & Reality";
                setPaperVisuals(false);
                document.body.classList.remove('paper-mode', 'landscape-mode');
            } else if (visualMode === 1) {
                // To Paper Box
                btn.innerText = "展卷";
                btn.className = "state-paper";
                hint.innerText = "Ink Mode · Click to Unfold";
                setPaperVisuals(true);
                document.body.classList.add('paper-mode');
                document.body.classList.remove('landscape-mode');
            } else if (visualMode === 2) {
                // To Landscape Scroll
                btn.innerText = "归位";
                btn.className = "state-scroll";
                hint.innerText = "Landscape Scroll · Static View";
                setPaperVisuals(true); 
                document.body.classList.add('paper-mode', 'landscape-mode');
            }
        }

        function setPaperVisuals(isPaper) {
            if (isPaper) {
                scene.fog.color.set(PAPER_BG);
                scene.fog.density = 0.002;
                wallMeshes.forEach(mesh => {
                    mesh.userData.baseColor = INK_COLOR;
                    mesh.userData.defaultColor = new THREE.Color(0xdddddd);
                });
                if(particles) {
                    particles.material.blending = THREE.NormalBlending;
                    const colors = particles.geometry.attributes.color.array;
                    for(let i=0; i<colors.length; i+=3) {
                        colors[i] = 0.1; colors[i+1] = 0.1; colors[i+2] = 0.1;
                    }
                    particles.geometry.attributes.color.needsUpdate = true;
                    particles.material.opacity = 0.4;
                }
            } else {
                scene.fog.color.set(DARK_BG);
                scene.fog.density = 0.005;
                wallMeshes.forEach(mesh => {
                    mesh.userData.baseColor = mesh.userData.config.color;
                    mesh.userData.defaultColor = new THREE.Color(0x333333);
                });
                if(particles) {
                    particles.material.blending = THREE.AdditiveBlending;
                    const colors = particles.geometry.attributes.color.array;
                    const orig = particles.geometry.attributes.origColor.array;
                    for(let i=0; i<colors.length; i++) {
                        colors[i] = orig[i];
                    }
                    particles.geometry.attributes.color.needsUpdate = true;
                    particles.material.opacity = 0.6;
                }
            }
        }

        document.getElementById('btnPaperMode').onclick = toggleMode;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            if (waterUniforms) {
                waterUniforms.uTime.value = time;
                // Water visibility logic
                const targetWaterOp = (visualMode === 2) ? 0.6 : 0.0;
                waterUniforms.uOpacity.value += (targetWaterOp - waterUniforms.uOpacity.value) * 0.05;
            }

            if (visualMode === 2) {
                // === LANDSCAPE SCROLL MODE ===
                camera.position.z += (CAMERA_SCROLL - camera.position.z) * 0.05;
                
                roomGroup.rotation.x *= 0.9;
                roomGroup.rotation.y *= 0.9;
                roomGroup.rotation.z *= 0.9;
                roomGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                roomGroup.position.x += (-100 - roomGroup.position.x) * 0.05; 

                // Place water relative to scroll
                if(waterMesh) {
                    waterMesh.position.set(0, -60, 0); // Position below the scroll
                    waterMesh.rotation.x = 0; // Face camera basically (vertical strip) since scroll is rotated -90
                }

                wallMeshes.forEach(mesh => {
                    const c = mesh.userData.config;
                    mesh.position.lerp(new THREE.Vector3(...c.flatPos), 0.05);
                    mesh.rotation.x += (-Math.PI/2 - mesh.rotation.x) * 0.05;
                    mesh.rotation.y += (0 - mesh.rotation.y) * 0.05;
                    mesh.rotation.z += (0 - mesh.rotation.z) * 0.05;
                    mesh.material.opacity += (0.8 - mesh.material.opacity) * 0.1;
                    mesh.material.color.lerp(mesh.userData.baseColor, 0.1);
                });
                connectionGroup.visible = false;

            } else {
                // === NON-SCROLL MODES ===
                if(waterMesh) waterMesh.position.y = -1000; // Hide way below

                const targetGroupX = isObserving ? -35 : 0;
                roomGroup.position.x += (targetGroupX - roomGroup.position.x) * 0.1;

                if (isObserving) {
                    const targetZ = CAMERA_FAR;
                    camera.position.z += (targetZ - camera.position.z) * 0.05;

                    const targetScale = 0.8;
                    roomGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                    roomGroup.rotation.y += 0.005; 
                    wallMeshes.forEach(mesh => {
                        const c = mesh.userData.config;
                        const targetPos = isHovering ? c.explodedPos : c.origPos;
                        mesh.position.lerp(new THREE.Vector3(...targetPos), 0.1);
                        mesh.rotation.x += (c.origRot[0] - mesh.rotation.x) * 0.1;
                        mesh.rotation.y += (c.origRot[1] - mesh.rotation.y) * 0.1;
                        mesh.rotation.z += (c.origRot[2] - mesh.rotation.z) * 0.1;
                        mesh.material.opacity += (0.6 - mesh.material.opacity) * 0.1;
                        mesh.material.color.lerp(mesh.userData.baseColor, 0.1);
                    });
                    connectionGroup.visible = false;

                } else {
                    const targetZ = CAMERA_NEAR;
                    camera.position.z += (targetZ - camera.position.z) * 0.05;
                    roomGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                    roomGroup.rotation.y += 0.001; 
                    wallMeshes.forEach(mesh => {
                        const c = mesh.userData.config;
                        mesh.position.lerp(new THREE.Vector3(...c.origPos), 0.1);
                        mesh.rotation.x += (c.origRot[0] - mesh.rotation.x) * 0.1;
                        mesh.rotation.y += (c.origRot[1] - mesh.rotation.y) * 0.1;
                        mesh.rotation.z += (c.origRot[2] - mesh.rotation.z) * 0.1;

                        const isBlowing = globalGain > 0.05;
                        const isActive = c.noteIdx.includes(currentNoteIndex);
                        
                        let targetOpacity = visualMode === 1 ? 0.2 : 0.1; 
                        let targetColor = mesh.userData.defaultColor;

                        if (isBlowing && isActive) {
                            targetOpacity = 0.9; 
                            targetColor = mesh.userData.baseColor;
                        } else if (isBlowing && !isActive) {
                            targetOpacity = 0.05; 
                        }
                        
                        mesh.material.opacity += (targetOpacity - mesh.material.opacity) * 0.1;
                        mesh.material.color.lerp(targetColor, 0.1);
                    });
                    connectionGroup.visible = visualMode === 0; 
                }
            }

            // --- Physics ---
            wallMeshes.forEach(mesh => {
                const data = mesh.userData;
                const isActive = data.config.noteIdx.includes(currentNoteIndex) && globalGain > 0.05;
                if (isActive) {
                    const positions = mesh.geometry.attributes.position.array;
                    const count = mesh.geometry.attributes.position.count;
                    for (let i = 0; i < count; i++) {
                        const ix = i * 3;
                        const x = positions[ix];
                        const y = positions[ix+1];
                        const noise1 = simplex.noise3D(x * 0.02, y * 0.02, time * 0.5);
                        let growth = Math.max(0, noise1) * globalGain * 0.4;
                        const edgeDist = Math.max(Math.abs(x), Math.abs(y)) / (WALL_SIZE/2);
                        if (edgeDist < 0.9) {
                            data.accumulatedZ[i] += growth * (1 - Math.pow(edgeDist, 6));
                        }
                    }
                    for (let i = 0; i < count; i++) {
                        if (data.accumulatedZ[i] > 60) data.accumulatedZ[i] = 60; 
                        positions[i * 3 + 2] = data.accumulatedZ[i];
                    }
                    mesh.geometry.attributes.position.needsUpdate = true;
                }
            });

            renderer.render(scene, camera);
        }

        document.getElementById('btnModeSwitch').onclick = () => {
            isObserving = !isObserving;
            const btnText = document.getElementById('btnModeText');
            const flute = document.getElementById('fluteWrapper');
            const uiHint = document.getElementById('ui-hint');
            
            if(isObserving) {
                btnText.innerText = "Back to Play";
                flute.classList.add('observing');
                uiHint.innerText = "Hover over walls to separate space";
            } else {
                btnText.innerText = "Observe Mode";
                flute.classList.remove('observing');
                uiHint.innerText = "Sound Moves Form · Void & Reality";
            }
        };

        loadAllAudio();
        initThree();
        initAudio(); 
    </script>
</body>
